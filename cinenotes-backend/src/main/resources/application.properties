spring.application.name=cinenotes-backend

# The hosting platform can provide PORT; 8081 is the local fallback.
server.port=${PORT:8081}

jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.access-token=${TMDB_ACCESS_TOKEN:}   
tmdb.connect-timeout-millis=${TMDB_CONNECT_TIMEOUT_MILLIS:3000}
tmdb.read-timeout-millis=${TMDB_READ_TIMEOUT_MILLIS:5000}
 