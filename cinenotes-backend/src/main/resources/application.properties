spring.application.name=cinenotes-backend

spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/cinenotes_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Replace JWT_SECRET outside local development. HS256 requires at least 32 bytes.
jwt.secret=${JWT_SECRET:cinenotes-dev-secret-key-change-me-1234567890}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
