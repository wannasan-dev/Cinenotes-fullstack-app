spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep database access inside explicit service/transaction boundaries.
spring.jpa.open-in-view=false

# Limit CineNotes to at most 5 pooled database connections.
spring.datasource.hikari.maximum-pool-size=5
# Keep only 1 idle connection ready.
spring.datasource.hikari.minimum-idle=1
# Retire pooled connections after 10 minutes.
spring.datasource.hikari.max-lifetime=600000
# Periodically validate idle connections.
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
